<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ganesh ~ Terminal Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --bg: #0a0e27;
    --fg: #00ff41;
    --secondary: #00ccff;
    --accent: #ff006e;
    --muted: #6b7280;
    --border: #1f2937;
    --white: #e5e7eb;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    line-height: 1.6;
    overflow-x: hidden;
  }

  /* Scrollbar */
  ::-webkit-scrollbar {
    width: 8px;
  }
  ::-webkit-scrollbar-track {
    background: var(--bg);
  }
  ::-webkit-scrollbar-thumb {
    background: var(--fg);
    border-radius: 4px;
  }

  /* ── TERMINAL HEADER ── */
  .terminal-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    background: var(--bg);
    border-bottom: 2px solid var(--fg);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 1000;
  }

  .terminal-buttons {
    display: flex;
    gap: 8px;
  }

  .terminal-btn {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    cursor: pointer;
  }

  .terminal-btn.close { background: #ff5f56; }
  .terminal-btn.minimize { background: #ffbd2e; }
  .terminal-btn.maximize { background: #27c93f; }

  .terminal-title {
    margin-left: 12px;
    color: var(--fg);
    font-size: 13px;
  }

  /* ── MAIN TERMINAL ── */
  .terminal-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 80px 20px 20px;
    min-height: 100vh;
  }

  .terminal-line {
    display: flex;
    margin-bottom: 16px;
    align-items: flex-start;
    opacity: 0;
    animation: fadeIn 0.3s ease forwards;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .prompt {
    color: var(--secondary);
    margin-right: 8px;
    font-weight: 600;
    white-space: nowrap;
  }

  .command {
    color: var(--fg);
    font-weight: 600;
  }

  .output {
    color: var(--white);
    margin-left: 0;
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.8;
  }

  .output.error {
    color: var(--accent);
  }

  .output.success {
    color: var(--fg);
  }

  .output.info {
    color: var(--secondary);
  }

  /* ── TYPING ANIMATION ── */
  .typing-cursor {
    display: inline-block;
    width: 2px;
    height: 1em;
    background: var(--fg);
    margin-left: 4px;
    animation: blink 1s infinite;
  }

  @keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  /* ── SECTION HEADERS ── */
  .section-header {
    color: var(--accent);
    font-weight: 700;
    margin-top: 24px;
    margin-bottom: 12px;
  }

  .divider {
    color: var(--border);
    margin: 16px 0;
  }

  /* ── SKILL TAGS ── */
  .skill-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 8px 0;
  }

  .skill-tag {
    background: rgba(0, 255, 65, 0.1);
    border: 1px solid var(--fg);
    padding: 4px 8px;
    border-radius: 4px;
    color: var(--fg);
    font-size: 12px;
  }

  /* ── PROJECT CARD ── */
  .project-card {
    background: rgba(0, 255, 65, 0.05);
    border: 1px solid var(--fg);
    border-radius: 4px;
    padding: 12px;
    margin: 8px 0;
    cursor: pointer;
    transition: all 0.3s;
  }

  .project-card:hover {
    background: rgba(0, 255, 65, 0.1);
    transform: translateX(8px);
  }

  .project-title {
    color: var(--secondary);
    font-weight: 600;
  }

  .project-desc {
    color: var(--white);
    margin-top: 4px;
    font-size: 13px;
  }

  /* ── EXPERIENCE ── */
  .exp-item {
    background: rgba(0, 204, 255, 0.05);
    border-left: 2px solid var(--secondary);
    padding: 12px 12px 12px 16px;
    margin: 8px 0;
    border-radius: 2px;
  }

  .exp-date {
    color: var(--secondary);
    font-size: 12px;
  }

  .exp-position {
    color: var(--fg);
    font-weight: 600;
  }

  .exp-company {
    color: var(--accent);
    font-size: 13px;
  }

  /* ── CONTACT ── */
  .contact-link {
    color: var(--secondary);
    text-decoration: none;
    cursor: pointer;
    transition: color 0.2s;
  }

  .contact-link:hover {
    color: var(--fg);
    text-decoration: underline;
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 768px) {
    body {
      font-size: 13px;
    }

    .terminal-container {
      padding: 70px 12px 12px;
    }

    .terminal-line {
      margin-bottom: 12px;
    }

    .terminal-header {
      padding: 10px 16px;
    }

    .terminal-title {
      font-size: 12px;
    }
  }

  @media (max-width: 480px) {
    body {
      font-size: 12px;
    }

    .terminal-container {
      padding: 65px 10px 10px;
    }

    .terminal-line {
      margin-bottom: 10px;
    }

    .skill-tag {
      font-size: 11px;
      padding: 3px 6px;
    }
  }

  /* ── MENU ── */
  .menu-button {
    display: none;
    position: fixed;
    top: 16px;
    right: 16px;
    background: none;
    border: 2px solid var(--fg);
    color: var(--fg);
    padding: 8px 12px;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    z-index: 999;
  }

  .menu-button:hover {
    color: var(--secondary);
    border-color: var(--secondary);
  }

  @media (max-width: 768px) {
    .menu-button {
      display: block;
    }
  }

  .menu-dropdown {
    display: none;
    position: fixed;
    top: 50px;
    right: 16px;
    background: var(--bg);
    border: 2px solid var(--fg);
    border-radius: 4px;
    z-index: 998;
  }

  .menu-dropdown.open {
    display: block;
  }

  .menu-item {
    display: block;
    width: 100%;
    padding: 10px 16px;
    background: none;
    border: none;
    color: var(--fg);
    text-align: left;
    font-family: 'JetBrains Mono', monospace;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
  }

  .menu-item:last-child {
    border-bottom: none;
  }

  .menu-item:hover {
    background: rgba(0, 255, 65, 0.1);
    color: var(--secondary);
  }
</style>
</head>
<body>

<!-- TERMINAL HEADER -->
<div class="terminal-header">
  <div class="terminal-buttons">
    <div class="terminal-btn close"></div>
    <div class="terminal-btn minimize"></div>
    <div class="terminal-btn maximize"></div>
  </div>
  <span class="terminal-title">ganesh@portfolio ~ %</span>
</div>

<!-- MENU BUTTON FOR MOBILE -->
<button class="menu-button" id="menuBtn">≡ menu</button>
<div class="menu-dropdown" id="menuDropdown">
  <button class="menu-item" onclick="scrollToSection('about')">about</button>
  <button class="menu-item" onclick="scrollToSection('skills')">skills</button>
  <button class="menu-item" onclick="scrollToSection('projects')">projects</button>
  <button class="menu-item" onclick="scrollToSection('experience')">experience</button>
  <button class="menu-item" onclick="scrollToSection('contact')">contact</button>
</div>

<!-- TERMINAL CONTAINER -->
<div class="terminal-container" id="terminal">
  <!-- Content will be dynamically generated -->
</div>

<script>
  const terminal = document.getElementById('terminal');
  const menuBtn = document.getElementById('menuBtn');
  const menuDropdown = document.getElementById('menuDropdown');

  // Menu toggle
  menuBtn.addEventListener('click', () => {
    menuDropdown.classList.toggle('open');
  });

  function scrollToSection(id) {
    menuDropdown.classList.remove('open');
    const element = document.getElementById(id);
    if (element) {
      element.scrollIntoView({ behavior: 'smooth' });
    }
  }

  // Terminal line data
  const commands = [
    {
      prompt: 'ganesh@portfolio ~ % ',
      command: 'whoami',
      output: 'Ganesh Devkota - Full Stack Developer & Designer',
      delay: 100
    },
    {
      prompt: 'ganesh@portfolio ~ % ',
      command: 'cat about.txt',
      output: `Hi! I'm a passionate developer with 5+ years of experience building beautiful,
functional digital experiences. I specialize in full-stack web development and
design-driven applications. Currently based in Kathmandu, working with clients worldwide.`,
      delay: 800,
      id: 'about'
    },
    {
      prompt: 'ganesh@portfolio ~ % ',
      command: 'ls -la skills/',
      output: 'Loading skills...',
      delay: 1600
    },
    {
      section: 'Frontend Development',
      tags: ['HTML', 'CSS', 'JavaScript', 'React', 'Responsive Design'],
      id: 'skills'
    },
    {
      section: 'Backend Development',
      tags: ['Node.js', 'Express', 'MongoDB', 'APIs', 'REST']
    },
    {
      section: 'Tools & Frameworks',
      tags: ['Git', 'Docker', 'Figma', 'Webpack', 'Firebase']
    },
    {
      section: 'Soft Skills',
      tags: ['Problem Solving', 'Communication', 'Collaboration', 'Agile', 'Leadership']
    },
    {
      prompt: 'ganesh@portfolio ~ % ',
      command: 'ls projects/',
      output: 'Displaying recent projects...',
      delay: 2800,
      id: 'projects'
    },
    {
      type: 'project',
      title: '01_ecommerce_platform',
      desc: 'Full-stack e-commerce with React, Node.js, MongoDB, Stripe integration'
    },
    {
      type: 'project',
      title: '02_design_system',
      desc: 'Reusable component library with 50+ components documented in Storybook'
    },
    {
      type: 'project',
      title: '03_task_manager_app',
      desc: 'Collaborative task management with real-time sync and WebSocket support'
    },
    {
      type: 'project',
      title: '04_analytics_dashboard',
      desc: 'Data visualization platform with real-time updates and API integration'
    },
    {
      prompt: 'ganesh@portfolio ~ % ',
      command: 'cat experience.log',
      output: 'Work experience timeline:',
      delay: 3600,
      id: 'experience'
    },
    {
      type: 'exp',
      date: '2023 - Present',
      position: 'Senior Full Stack Developer',
      company: 'Tech Solutions Inc.',
      desc: 'Leading development of enterprise applications, mentoring junior developers'
    },
    {
      type: 'exp',
      date: '2021 - 2023',
      position: 'Full Stack Developer',
      company: 'Creative Digital Agency',
      desc: 'Developed responsive web apps for diverse clients, collaborated with designers'
    },
    {
      type: 'exp',
      date: '2019 - 2021',
      position: 'Junior Frontend Developer',
      company: 'StartUp Hub',
      desc: 'Started professional journey with front-end development using React and JavaScript'
    },
    {
      prompt: 'ganesh@portfolio ~ % ',
      command: 'contact --info',
      output: 'Getting in touch...',
      delay: 4400,
      id: 'contact'
    },
    {
      type: 'contact',
      email: 'ganesh@example.com',
      twitter: 'https://twitter.com',
      linkedin: 'https://linkedin.com/in/ganesh',
      github: 'https://github.com/ganeshganesh100'
    },
    {
      prompt: 'ganesh@portfolio ~ % ',
      command: 'clear',
      output: '',
      delay: 5200
    }
  ];

  let delay = 0;

  function addTerminalLine(cmd) {
    delay += (cmd.delay || 300);

    setTimeout(() => {
      const line = document.createElement('div');
      line.className = 'terminal-line';
      
      if (cmd.id) {
        line.id = cmd.id;
      }

      if (cmd.section) {
        line.innerHTML = `<div class="section-header">> ${cmd.section}</div>`;
        if (cmd.tags) {
          const tags = document.createElement('div');
          tags.className = 'skill-tags';
          tags.innerHTML = cmd.tags.map(t => `<span class="skill-tag">${t}</span>`).join('');
          line.appendChild(tags);
        }
      } else if (cmd.type === 'project') {
        line.innerHTML = `
          <div style="width: 100%;">
            <div class="project-card">
              <div class="project-title">${cmd.title}</div>
              <div class="project-desc">${cmd.desc}</div>
            </div>
          </div>
        `;
      } else if (cmd.type === 'exp') {
        line.innerHTML = `
          <div style="width: 100%;">
            <div class="exp-item">
              <div class="exp-date">[${cmd.date}]</div>
              <div class="exp-position">${cmd.position}</div>
              <div class="exp-company">@ ${cmd.company}</div>
              <div style="color: var(--white); font-size: 13px; margin-top: 4px;">${cmd.desc}</div>
            </div>
          </div>
        `;
      } else if (cmd.type === 'contact') {
        line.innerHTML = `
          <div style="width: 100%;">
            <div style="margin: 12px 0; line-height: 2;">
              <div>📧 Email: <a href="mailto:${cmd.email}" class="contact-link">${cmd.email}</a></div>
              <div>🐦 Twitter: <a href="${cmd.twitter}" target="_blank" class="contact-link">@ganesh</a></div>
              <div>💼 LinkedIn: <a href="${cmd.linkedin}" target="_blank" class="contact-link">ganesh-devkota</a></div>
              <div>💻 GitHub: <a href="${cmd.github}" target="_blank" class="contact-link">ganeshganesh100</a></div>
            </div>
          </div>
        `;
      } else if (cmd.command) {
        const promptSpan = document.createElement('span');
        promptSpan.className = 'prompt';
        promptSpan.textContent = cmd.prompt;

        const commandSpan = document.createElement('span');
        commandSpan.className = 'command';
        commandSpan.textContent = cmd.command;

        line.appendChild(promptSpan);
        line.appendChild(commandSpan);

        if (cmd.output) {
          const outputDiv = document.createElement('div');
          outputDiv.className = 'output success';
          outputDiv.style.marginTop = '8px';
          outputDiv.textContent = cmd.output;
          line.appendChild(outputDiv);
        }
      }

      terminal.appendChild(line);
      window.scrollTo(0, document.body.scrollHeight);
    }, delay);
  }

  // Generate all lines
  commands.forEach(cmd => addTerminalLine(cmd));

  // Add input prompt at the end
  setTimeout(() => {
    const inputLine = document.createElement('div');
    inputLine.className = 'terminal-line';
    inputLine.innerHTML = `
      <span class="prompt">ganesh@portfolio ~ % </span>
      <input type="text" id="terminalInput" style="background: none; border: none; color: var(--fg); font-family: 'JetBrains Mono', monospace; font-size: 14px; outline: none; width: 300px;" placeholder="type 'help' for commands">
      <span class="typing-cursor"></span>
    `;
    terminal.appendChild(inputLine);
    
    const input = document.getElementById('terminalInput');
    if (input) {
      input.focus();
      input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          const cmd = input.value.toLowerCase().trim();
          if (cmd === 'help') {
            const helpText = `Available commands:
  about           - Learn about Ganesh
  skills          - View technical skills
  projects        - See featured projects
  experience      - View work experience
  contact         - Get contact information
  clear           - Clear terminal`;
            const helpLine = document.createElement('div');
            helpLine.className = 'terminal-line';
            helpLine.innerHTML = `<div class="output info">${helpText}</div>`;
            terminal.appendChild(helpLine);
          }
          input.value = '';
        }
      });
    }
  }, delay + 500);
</script>

</body>
</html>
